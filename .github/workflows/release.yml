name: Build GaTas

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'           # e.g. v1.2.3
      - '*-prerelease' # e.g. v1.2.3-prerelease
      - '*-rc[0-9][0-9]' # e.g. v1.2.3-rc00 through v1.2.3-rc99

jobs:

  Test:
    name: Run the unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GATAS
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get remove --purge gcc-11 gcc-12 gcc-13
          sudo apt-get install -y tree git ninja-build cmake gcc-14

      - name: Build and Test
        uses: ./.github/actions/build_project
        with:
          test: 'true'


  Firmware:
    name: Build Firmware (RP2040 + RP2350)
    runs-on: ubuntu-latest
    needs: Test
    strategy:
      fail-fast: true
      matrix:
        platform:
          - { name: "rp2040", cmake_platform: "rp2040", board: "pico_w", outfile: "GATAS_rp2040.uf2" }
          - { name: "rp2350", cmake_platform: "rp2350", board: "pico2_w", outfile: "GATAS_rp2350-arm-s.uf2" }

    steps:
      - name: Checkout GATAS
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Environment
        uses: ./.github/actions/setup_env

      - name: Configure CMake
        shell: bash
        run: |
          export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk/
          export FREERTOS_KERNEL_PATH=$GITHUB_WORKSPACE/FreeRTOS-Kernel
          cd src/pico
          cmake -B build_${{ matrix.platform.name }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_PLATFORM=${{ matrix.platform.cmake_platform }} \
            -DPICO_BOARD=${{ matrix.platform.board }} \
            -DGATAS_UART_OVER_USB=1

      - name: Build Firmware
        shell: bash
        run: |
          export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk/
          export FREERTOS_KERNEL_PATH=$GITHUB_WORKSPACE/FreeRTOS-Kernel
          cd src/pico
          ninja -C build_${{ matrix.platform.name }}

      - name: Rename UF2
        shell: bash
        run: |
          cd src/pico
          UF2=$(find build_${{ matrix.platform.name }} -name "*.uf2" | head -n 1)
          cp "$UF2" "${{ matrix.platform.outfile }}"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.platform.name }}
          path: src/pico/${{ matrix.platform.outfile }}
          if-no-files-found: error

  PreRelease:
    needs: [ "Firmware" ]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout GATAS
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: firmware-rp2040
          path: firmware/rp2040

      - uses: actions/download-artifact@v4
        with:
          name: firmware-rp2350
          path: firmware/rp2350

      - name: Verify files exist
        run: |
          ls -l firmware/rp2040
          ls -l firmware/rp2350
          test -f firmware/rp2040/GATAS_rp2040.uf2
          test -f firmware/rp2350/GATAS_rp2350-arm-s.uf2

      - name: Build pre-release body
        if: endsWith(github.ref_name, '-prerelease') || contains(github.ref_name, '-rc')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{if(flag)exit} flag' CHANGELOG.md > /tmp/changelog_section.md
          python3 -c "
          import os
          t = open('.github/develop.md').read()
          c = open('/tmp/changelog_section.md').read().strip()
          t = t.replace('{{CHANGELOG}}', c)
          t = t.replace('{{VERSION}}', os.environ['VERSION'])
          print(t)
          " > /tmp/release_body.md

      - name: Build release body
        if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-prerelease') && !contains(github.ref_name, '-rc')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]"{flag=1; next} /^## \[/{if(flag)exit} flag' CHANGELOG.md > /tmp/changelog_section.md
          if [ ! -s /tmp/changelog_section.md ]; then
            echo "Failed to extract changelog section for ${VERSION}" >&2
            exit 1
          fi
          python3 -c "
          import os
          t = open('.github/release.md').read()
          c = open('/tmp/changelog_section.md').read().strip()
          t = t.replace('{{CHANGELOG}}', c)
          t = t.replace('{{VERSION}}', os.environ['VERSION'])
          print(t)
          " > /tmp/release_body.md

      - name: Push to Pre-Release
        if: endsWith(github.ref_name, '-prerelease') || contains(github.ref_name, '-rc')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          draft: false
          name: ${{ github.ref_name }}
          body_path: /tmp/release_body.md
          files: |
            ./.github/develop.md
            ./LICENSE
            ./CHANGELOG.md
            firmware/rp2040/GATAS_rp2040.uf2
            firmware/rp2350/GATAS_rp2350-arm-s.uf2

      - name: Push to Release
        if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-prerelease') && !contains(github.ref_name, '-rc')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          draft: false
          name: ${{ github.ref_name }}
          body_path: /tmp/release_body.md
          files: |
            ./.github/release.md
            ./LICENSE
            ./CHANGELOG.md
            firmware/rp2040/GATAS_rp2040.uf2
            firmware/rp2350/GATAS_rp2350-arm-s.uf2

      - name: Notify Discord
        if: endsWith(github.ref_name, '-prerelease') || contains(github.ref_name, '-rc') || (startsWith(github.ref, 'refs/tags/v'))
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping Discord notification."
            exit 0
          fi

          if [[ "$TAG_NAME" == *-prerelease || "$TAG_NAME" == *-rc* ]]; then
            KIND="Release Candidate"
          else
            KIND="Release"
          fi

          RELEASE_URL="https://github.com/${REPOSITORY}/releases/tag/${TAG_NAME}"
          SHORT_SHA="${SHA:0:7}"

          payload=$(KIND="$KIND" TAG_NAME="$TAG_NAME" RELEASE_URL="$RELEASE_URL" SHORT_SHA="$SHORT_SHA" python3 - <<'PY'
          import json
          import os

          kind = os.environ["KIND"]
          tag_name = os.environ["TAG_NAME"]
          release_url = os.environ["RELEASE_URL"]
          short_sha = os.environ["SHORT_SHA"]

          message = f"**OpenAce {kind} published**: `{tag_name}` ({short_sha})\n{release_url}"
          print(json.dumps({"content": message}))
          PY
          )

          curl -fsSL \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
